[graph]
path = "film.gdl"

[messages]
crates = ["gdl-demo-nodes", "acme-gdl-nodes"]

[nodes]
crates = ["gdl-demo-nodes", "acme-gdl-nodes"]
pin = { Http = "gdl_demo_nodes::HttpFrontend", Engine = "gdl_demo_nodes::MockEngine", UsageTap = "acme_gdl_nodes::UsageTap" }

[config.Engine]
model = "film-engine"
uppercase = true

[config.UsageTap]
tenant = "acme-film"
enabled = true

[gdl]
path = "../../crates/gdl-runtime"

# The serving binary's global allocator: `system` (the default),
# `mimalloc`, or `jemalloc`.
[binary]
allocator = "mimalloc"

[segment.all]
nodes = ["Http", "Engine", "UsageTap"]
