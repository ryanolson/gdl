# The gdl-demo commit is on that repository's `gdl-a88cdaff` branch, not its main. Its crates depend on
# gdl at this file's `[gdl] rev`, so the two move together: a segment links one copy of gdl.
[graph]
path = "film.gdl"

[messages]
crates = [{ package = "gdl-demo-nodes", git = "https://github.com/ryanolson/gdl-demo", rev = "ef3e0e9de7d18e877769e37f18e728a3567bcb17" }, { package = "acme-gdl-nodes", git = "https://github.com/ryanolson/gdl-demo", rev = "ef3e0e9de7d18e877769e37f18e728a3567bcb17" }]

[nodes]
crates = [{ package = "gdl-demo-nodes", git = "https://github.com/ryanolson/gdl-demo", rev = "ef3e0e9de7d18e877769e37f18e728a3567bcb17" }, { package = "acme-gdl-nodes", git = "https://github.com/ryanolson/gdl-demo", rev = "ef3e0e9de7d18e877769e37f18e728a3567bcb17" }]
pin = { Http = "gdl_demo_nodes::HttpFrontend", Engine = "gdl_demo_nodes::MockEngine", UsageTap = "acme_gdl_nodes::UsageTap" }

[config.Engine]
model = "film-engine"
uppercase = true

[config.UsageTap]
tenant = "acme-film"
enabled = true

[gdl]
git = "https://github.com/ryanolson/gdl"
rev = "a88cdaff4cb896892989ab0b2826984f1bc90915"

[segment.front]
nodes = ["Http"]

[segment.engine]
nodes = ["Engine"]

[segment.accounting]
nodes = ["UsageTap"]

[deployment.segment.front]
ports = ["127.0.0.1:8082:8082", "127.0.0.1:9090:9090"]

[deployment.segment.front.config.frontend]
listen = "0.0.0.0:8082"

[deployment.segment.engine]
ports = ["127.0.0.1:9091:9090"]

[deployment.segment.engine.config.node.Engine]
delay_ms = 0

[deployment.segment.accounting]
ports = ["127.0.0.1:9092:9090"]

[deployment.segment.accounting.config.node.UsageTap]
accounting_url = "http://ledger:8091/usage"
