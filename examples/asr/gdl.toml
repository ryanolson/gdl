# The ASR example's spec: the graph file, the crate that holds its
# messages, the crates that implement its nodes, and which segment hosts
# which node. The audio crosses twice: from the client's segment to the
# resampler, and from the resampler to the recognizer. Build every segment
# with:
#
#     cargo run -p gdl-gen -- build --spec examples/asr/gdl.toml

[graph]
path = "asr.gdl"

[messages]
crates = ["protocols"]

# The node crates: each graph node binds to the node of its name that
# they offer, read from their source. The source, `Client`, is the
# program that calls the front segment's library.
[nodes]
crates = ["front-nodes", "dsp-nodes", "engine-mock"]

[gdl]
path = "../../crates/gdl-runtime"

[segment.front]
nodes = ["Client", "Gateway"]

[segment.dsp]
nodes = ["Resample"]

[segment.engine]
nodes = ["Recognizer", "Punctuate"]
