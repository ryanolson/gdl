# The ASR example: a graph whose requests stream. A client sends a session's
# settings and a stream of audio; transcripts stream back while the audio
# still streams in. Its messages, the crates implementing its nodes, and the
# graph and spec that `cargo gdl build` builds the segments from. Its own
# workspace, as a deployment's would be. The demo in `demo/` links the
# generated segment libraries, so it is not a member:
# `crates/gdl-gen/tests/asr.rs` builds it beside them.
[workspace]
members = [
    "dsp-nodes",
    "engine-mock",
    "front-nodes",
    "protocols",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
futures = "0.3"
gdl = { path = "../../crates/gdl" }
gdl-runtime = { path = "../../crates/gdl-runtime" }
gdl-message = { path = "../../crates/gdl-message" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
