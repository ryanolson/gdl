[graph]
path = "api.gdl"
[messages]
crates = [{ package = "api-frontend", git = "https://github.com/ryanolson/gdl", rev = "7e6bdd8dd0d6b6273265709c98ea5b7c9f44f74e" }]
[nodes]
crates = [{ package = "api-frontend", git = "https://github.com/ryanolson/gdl", rev = "7e6bdd8dd0d6b6273265709c98ea5b7c9f44f74e" }]
pin = { Http = "api_frontend::ApiFrontend", Engine = "api_frontend::Echo" }
[entry.chat]
target = "Http"
forward = ["api_frontend::ExtractChat"]
backward = ["api_frontend::FormatChat"]
[entry.responses]
operator = "api_frontend::ResponsesAdapter"
nested = { target = "Http" }
[entry.anthropic]
operator = "api_frontend::AnthropicAdapter"
nested = { target = "Http" }
[config.Http]
enabled_chat = true
enabled_responses = true
enabled_anthropic = true
[gdl]
git = "https://github.com/ryanolson/gdl"
rev = "7e6bdd8dd0d6b6273265709c98ea5b7c9f44f74e"
[segment.front]
nodes = ["Http"]
[segment.engine]
nodes = ["Engine"]
