[package]
name = "api-frontend"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
gdl = { path = "../../crates/gdl" }
axum = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
[dev-dependencies]
gdl-runtime = { path = "../../crates/gdl-runtime" }
reqwest = { version = "0.12", features = ["json"] }
