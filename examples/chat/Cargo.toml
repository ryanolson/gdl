# The chat example: its messages and the crates implementing its nodes.
# `cargo gdl build --spec gdl.toml` generates the contract and segment
# crates in the target directory and builds them. Its own workspace, as a
# deployment's would be.
[workspace]
members = [
    "engine-mock",
    "front-nodes",
    "post-nodes",
    "protocols",
    "sentinel",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
futures = "0.3"
gdl = { path = "../../crates/gdl" }
gdl-runtime = { path = "../../crates/gdl-runtime" }
gdl-message = { path = "../../crates/gdl-message" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time"] }
