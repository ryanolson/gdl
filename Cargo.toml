[workspace]
members = ["crates/gdl", "crates/gdl-extract", "crates/gdl-gen", "crates/gdl-macros", "crates/gdl-message", "crates/gdl-model", "crates/gdl-syntax"]
# The example is its own workspace, as a deployment would be: its segment
# crates must build with only the implementations they host.
exclude = ["examples"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
criterion = { version = "0.7", default-features = false, features = ["async_tokio"] }
dashmap = "6"
futures = "0.3"
linkme = "0.3"
pin-project-lite = "0.2"
prometheus = "0.14"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
thiserror = "2"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
trybuild = "1"
velo = { version = "=0.19.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
# The remote bench reports tasks spawned per request when built with
# `--cfg tokio_unstable`, the only way tokio exposes that count.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
