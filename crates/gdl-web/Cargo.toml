[package]
name = "gdl-web"
description = "The gdl composer: a web page and its server, to build graphs from crates in a working catalogue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
gdl-extract = { path = "../gdl-extract" }
gdl-gen = { path = "../gdl-gen" }
gdl-syntax = { path = "../gdl-syntax" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
toml = { workspace = true }

[dev-dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }
http-body-util = "0.1"
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
