[package]
name = "gdl-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
figment = { workspace = true, features = ["env"] }
futures.workspace = true
gdl-pools = { path = "../gdl-pools" }
gdl-model = { path = "../gdl-model" }
gdl-watch = { path = "../gdl-watch" }
# The keyed record table's order of use.
lru = "0.16"
velo-hub = { workspace = true, features = ["server", "client"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tokio-util.workspace = true
tracing = "0.1"
# The binary's log, without the `ansi` and `log` bridge features: the log
# has no colour, and nothing in the hub uses `log`.
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
serde.workspace = true
# The `dynamodb` feature's: the DynamoDB pool directory, and what a hub
# needs to reach AWS that the directory's crate leaves to its caller, a
# credential chain and an HTTPS client.
gdl-pools-dynamodb = { path = "../gdl-pools-dynamodb", optional = true }
aws-config = { version = "1", default-features = false, features = ["rt-tokio"], optional = true }
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio"], optional = true }
aws-smithy-http-client = { version = "1", default-features = false, features = ["rustls-ring"], optional = true }

[features]
# The DynamoDB pool directory (`GDL_POOL__DIRECTORY=dynamodb`, and
# `gdl-hub --tables`). Off by default: it links the AWS SDK, a credential
# chain, and a TLS stack, the heaviest dependencies in the workspace, which
# a hub under `relay` or `dir` never uses.
dynamodb = ["dep:gdl-pools-dynamodb", "dep:aws-config", "dep:aws-sdk-dynamodb", "dep:aws-smithy-http-client"]
# The test target that runs hub binaries against DynamoDB Local, outside the
# default suite: `scripts/dynamodb-local.sh` starts DynamoDB Local and runs
# it.
dynamodb-local = ["dynamodb"]

[[test]]
name = "dynamodb"
required-features = ["dynamodb-local"]

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
toml.workspace = true
# Proves that a verified report cannot be built outside verification.
trybuild = { workspace = true }

# The keyed record service's round trip and rate: a load run that prints
# its quantiles, not a criterion bench.
[[bench]]
name = "keyed"
harness = false
