[package]
name = "gdl-pools"
description = "The pool plane's shared types: the pool record, the pool directory and its backends, and the reader's view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Every directory backend and the hub depend on this crate, so it stays
# free of velo and velo-hub: a backend crate must not pull in the
# transport to implement the trait.
[dependencies]
futures = { workspace = true }
gdl-model = { path = "../gdl-model" }
serde = { workspace = true }
# The `dir` backend's files.
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[features]
# The directory conformance suite, for a backend crate's tests.
conformance = []

[dev-dependencies]
# The crate's own tests run the conformance suite against `memory`.
gdl-pools = { path = ".", features = ["conformance"] }
tempfile = { workspace = true }
# A paused clock lets the suite's bounds be tested against a backend that
# never completes, without waiting them out.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
