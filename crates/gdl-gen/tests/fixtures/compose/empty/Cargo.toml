[package]
name = "empty-protocols"
version = "0.0.0"
edition = "2024"
publish = false

# A library named like a Rust 2024 keyword: a program can reach it only
# as `r#gen`, or under another name.
[lib]
name = "gen"

[dependencies]
serde = { version = "1", features = ["derive"] }

# Not a member of the repository workspace: it is read by the tests, and
# built only for the contracts they generate.
[workspace]
