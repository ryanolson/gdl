[package]
name = "dual-macro"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
proc-macro = true

# Both catalogues, in the compiler: the macro panics there, never in the program
# that reads the catalogue.
[dependencies]
gdl-message = { path = "../../../../../gdl-message" }
stray = { package = "gdl-message", path = "../stray-message" }

# Not a member of the repository workspace: it is built only by the
# catalogue programs that the tests generate.
[workspace]
