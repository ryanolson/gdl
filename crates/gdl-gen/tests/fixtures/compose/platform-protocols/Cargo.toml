[package]
name = "platform-protocols"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
gdl-message = { path = "../../../../../gdl-message" }
stray-macro = { path = "../stray-macro" }

# Another package named `gdl-message`, which never reaches the catalogue
# program:
# through a proc macro, on another target, and for a build script.
[target.'cfg(not(any(unix, windows)))'.dependencies]
other-message = { package = "gdl-message", path = "../stray-message" }

[build-dependencies]
other-message = { package = "gdl-message", path = "../stray-message" }

# Not a member of the repository workspace: it is built only by the
# catalogue programs that the tests generate.
[workspace]
