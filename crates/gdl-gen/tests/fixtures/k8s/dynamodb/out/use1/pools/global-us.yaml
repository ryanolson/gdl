---
{
  "apiVersion": "v1",
  "data": {
    "deployment.json": "{\n  \"graph\": {\n    \"name\": \"api\",\n    \"schema\": 1,\n    \"nodes\": [\n      {\n        \"name\": \"Http\",\n        \"role\": \"source\",\n        \"binding\": null\n      },\n      {\n        \"name\": \"Engine\",\n        \"role\": \"sink\",\n        \"binding\": \"engine\"\n      }\n    ],\n    \"hops\": [\n      {\n        \"outer\": \"Http\",\n        \"forward\": [],\n        \"inner\": \"Engine\",\n        \"backward\": [],\n        \"forward_types\": [\n          {\n            \"name\": \":: api_frontend :: Prompt\",\n            \"wire\": true,\n            \"encoding\": \"msgpack\"\n          }\n        ],\n        \"backward_types\": [\n          {\n            \"name\": \":: api_frontend :: Chunk\",\n            \"wire\": true,\n            \"encoding\": \"msgpack\"\n          }\n        ]\n      }\n    ]\n  },\n  \"placement\": {\n    \"segment\": {\n      \"engine\": {\n        \"nodes\": [\n          \"Engine\"\n        ]\n      },\n      \"front\": {\n        \"nodes\": [\n          \"Http\"\n        ]\n      }\n    },\n    \"class\": {\n      \"global\": {\n        \"segments\": [\n          \"front\"\n        ]\n      },\n      \"model_x\": {\n        \"segments\": [\n          \"engine\"\n        ]\n      }\n    }\n  }\n}",
    "front.toml": "listen = \"0.0.0.0:9000\"\nrendezvous_ms = 60000\n\n[system]\nhost = \"0.0.0.0\"\nport = 9090\n"
  },
  "kind": "ConfigMap",
  "metadata": {
    "labels": {
      "gdl.dev/class": "global",
      "gdl.dev/cluster": "use1",
      "gdl.dev/fleet": "api",
      "gdl.dev/pool": "global-us",
      "gdl.dev/region": "us-east-1"
    },
    "name": "global-us",
    "namespace": "gdl-api"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "labels": {
      "gdl.dev/class": "global",
      "gdl.dev/cluster": "use1",
      "gdl.dev/fleet": "api",
      "gdl.dev/pool": "global-us",
      "gdl.dev/region": "us-east-1",
      "gdl.dev/segment": "hub"
    },
    "name": "global-us",
    "namespace": "gdl-api"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "gdl.dev/fleet": "api",
        "gdl.dev/pool": "global-us",
        "gdl.dev/segment": "hub"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "annotations": {
          "gdl.dev/config": "3dad74e221897c07",
          "prometheus.io/path": "/v1/ext/gdl-pool/metrics",
          "prometheus.io/port": "1337",
          "prometheus.io/scrape": "true"
        },
        "labels": {
          "gdl.dev/class": "global",
          "gdl.dev/cluster": "use1",
          "gdl.dev/fleet": "api",
          "gdl.dev/pool": "global-us",
          "gdl.dev/region": "us-east-1",
          "gdl.dev/segment": "hub"
        }
      },
      "spec": {
        "containers": [
          {
            "command": [
              "/usr/local/bin/segment",
              "/etc/gdl/fleet/deployment.json"
            ],
            "env": [
              {
                "name": "GDL_POD_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.podIP"
                  }
                }
              },
              {
                "name": "GDL_POOL__AWS_REGION",
                "value": "us-east-1"
              },
              {
                "name": "GDL_POOL__CLASS",
                "value": "global"
              },
              {
                "name": "GDL_POOL__DIRECTORY",
                "value": "dynamodb"
              },
              {
                "name": "GDL_POOL__ENDPOINT",
                "value": "http://dynamodb-local:8000"
              },
              {
                "name": "GDL_POOL__HUB",
                "value": "$(GDL_POD_IP):1337"
              },
              {
                "name": "GDL_POOL__LISTS_TABLE",
                "value": "gdl-pool-lists"
              },
              {
                "name": "GDL_POOL__NAME",
                "value": "global-us"
              },
              {
                "name": "GDL_POOL__READY__FRONT",
                "value": "2"
              },
              {
                "name": "GDL_POOL__RECORDS_TABLE",
                "value": "gdl-pools"
              },
              {
                "name": "GDL_POOL__REGION",
                "value": "us-east-1"
              },
              {
                "name": "GDL_POOL__SUMMARY_MS",
                "value": "10000"
              }
            ],
            "image": "registry.example/gdl/api-hub:pinned",
            "livenessProbe": {
              "failureThreshold": 30,
              "httpGet": {
                "path": "/v1/health",
                "port": 1337
              },
              "periodSeconds": 2,
              "timeoutSeconds": 2
            },
            "name": "hub",
            "ports": [
              {
                "containerPort": 1337,
                "name": "public"
              },
              {
                "containerPort": 8337,
                "name": "control"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/v1/health",
                "port": 1337
              },
              "periodSeconds": 2,
              "timeoutSeconds": 2
            },
            "volumeMounts": [
              {
                "mountPath": "/etc/gdl/fleet",
                "name": "config",
                "readOnly": true
              }
            ]
          }
        ],
        "enableServiceLinks": false,
        "nodeSelector": {
          "kubernetes.io/arch": "amd64",
          "kubernetes.io/os": "linux"
        },
        "serviceAccountName": "api",
        "volumes": [
          {
            "configMap": {
              "name": "global-us"
            },
            "name": "config"
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "labels": {
      "gdl.dev/class": "global",
      "gdl.dev/cluster": "use1",
      "gdl.dev/fleet": "api",
      "gdl.dev/pool": "global-us",
      "gdl.dev/region": "us-east-1",
      "gdl.dev/segment": "hub"
    },
    "name": "global-us",
    "namespace": "gdl-api"
  },
  "spec": {
    "ports": [
      {
        "name": "public",
        "port": 1337,
        "targetPort": 1337
      },
      {
        "name": "control",
        "port": 8337,
        "targetPort": 8337
      }
    ],
    "selector": {
      "gdl.dev/fleet": "api",
      "gdl.dev/pool": "global-us",
      "gdl.dev/segment": "hub"
    },
    "type": "ClusterIP"
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "labels": {
      "gdl.dev/class": "global",
      "gdl.dev/cluster": "use1",
      "gdl.dev/fleet": "api",
      "gdl.dev/pool": "global-us",
      "gdl.dev/region": "us-east-1",
      "gdl.dev/segment": "front"
    },
    "name": "global-us-front",
    "namespace": "gdl-api"
  },
  "spec": {
    "replicas": 2,
    "selector": {
      "matchLabels": {
        "gdl.dev/fleet": "api",
        "gdl.dev/pool": "global-us",
        "gdl.dev/segment": "front"
      }
    },
    "template": {
      "metadata": {
        "annotations": {
          "gdl.dev/config": "3dad74e221897c07",
          "prometheus.io/path": "/metrics",
          "prometheus.io/port": "9090",
          "prometheus.io/scrape": "true"
        },
        "labels": {
          "gdl.dev/class": "global",
          "gdl.dev/cluster": "use1",
          "gdl.dev/fleet": "api",
          "gdl.dev/pool": "global-us",
          "gdl.dev/region": "us-east-1",
          "gdl.dev/segment": "front"
        }
      },
      "spec": {
        "containers": [
          {
            "command": [
              "/usr/local/bin/segment",
              "/etc/gdl/fleet/front.toml"
            ],
            "env": [
              {
                "name": "GDL_HUB__HOST",
                "value": "global-us"
              },
              {
                "name": "GDL_POOL__AWS_REGION",
                "value": "us-east-1"
              },
              {
                "name": "GDL_POOL__CLASS",
                "value": "global"
              },
              {
                "name": "GDL_POOL__DIRECTORY",
                "value": "dynamodb"
              },
              {
                "name": "GDL_POOL__ENDPOINT",
                "value": "http://dynamodb-local:8000"
              },
              {
                "name": "GDL_POOL__HUB",
                "value": "global-us:1337"
              },
              {
                "name": "GDL_POOL__LISTS_TABLE",
                "value": "gdl-pool-lists"
              },
              {
                "name": "GDL_POOL__NAME",
                "value": "global-us"
              },
              {
                "name": "GDL_POOL__READY__FRONT",
                "value": "2"
              },
              {
                "name": "GDL_POOL__RECORDS_TABLE",
                "value": "gdl-pools"
              },
              {
                "name": "GDL_POOL__REGION",
                "value": "us-east-1"
              },
              {
                "name": "GDL_POOL__SUMMARY_MS",
                "value": "10000"
              }
            ],
            "image": "registry.example/gdl/api-front:pinned",
            "livenessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/live",
                "port": 9090
              },
              "periodSeconds": 10,
              "timeoutSeconds": 3
            },
            "name": "segment",
            "ports": [
              {
                "containerPort": 9090,
                "name": "system"
              },
              {
                "containerPort": 8080,
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/health",
                "port": 9090
              },
              "periodSeconds": 5,
              "timeoutSeconds": 3
            },
            "volumeMounts": [
              {
                "mountPath": "/etc/gdl/fleet",
                "name": "config",
                "readOnly": true
              },
              {
                "mountPath": "/run/secrets",
                "name": "secrets",
                "readOnly": true
              }
            ]
          }
        ],
        "enableServiceLinks": false,
        "nodeSelector": {
          "kubernetes.io/arch": "amd64",
          "kubernetes.io/os": "linux"
        },
        "serviceAccountName": "api",
        "terminationGracePeriodSeconds": 630,
        "volumes": [
          {
            "configMap": {
              "name": "global-us"
            },
            "name": "config"
          },
          {
            "name": "secrets",
            "projected": {
              "sources": [
                {
                  "secret": {
                    "items": [
                      {
                        "key": "fingerprint",
                        "path": "fingerprint"
                      }
                    ],
                    "name": "api-fingerprint"
                  }
                }
              ]
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "labels": {
      "gdl.dev/class": "global",
      "gdl.dev/cluster": "use1",
      "gdl.dev/fleet": "api",
      "gdl.dev/pool": "global-us",
      "gdl.dev/region": "us-east-1",
      "gdl.dev/segment": "front"
    },
    "name": "global-us-front",
    "namespace": "gdl-api"
  },
  "spec": {
    "ports": [
      {
        "name": "tcp-8080",
        "port": 8080,
        "protocol": "TCP",
        "targetPort": 8080
      }
    ],
    "selector": {
      "gdl.dev/fleet": "api",
      "gdl.dev/pool": "global-us",
      "gdl.dev/segment": "front"
    },
    "type": "ClusterIP"
  }
}
