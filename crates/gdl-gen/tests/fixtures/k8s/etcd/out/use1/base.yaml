---
{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "labels": {
      "gdl.dev/cluster": "use1",
      "gdl.dev/fleet": "api"
    },
    "name": "gdl-api"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "ServiceAccount",
  "metadata": {
    "labels": {
      "gdl.dev/cluster": "use1",
      "gdl.dev/fleet": "api"
    },
    "name": "api",
    "namespace": "gdl-api"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "PersistentVolumeClaim",
  "metadata": {
    "labels": {
      "gdl.dev/cluster": "use1",
      "gdl.dev/directory": "etcd",
      "gdl.dev/fleet": "api"
    },
    "name": "etcd-data",
    "namespace": "gdl-api"
  },
  "spec": {
    "accessModes": [
      "ReadWriteOnce"
    ],
    "resources": {
      "requests": {
        "storage": "10Gi"
      }
    }
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "labels": {
      "gdl.dev/cluster": "use1",
      "gdl.dev/directory": "etcd",
      "gdl.dev/fleet": "api"
    },
    "name": "etcd",
    "namespace": "gdl-api"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "gdl.dev/cluster": "use1",
        "gdl.dev/directory": "etcd",
        "gdl.dev/fleet": "api"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "labels": {
          "gdl.dev/cluster": "use1",
          "gdl.dev/directory": "etcd",
          "gdl.dev/fleet": "api"
        }
      },
      "spec": {
        "containers": [
          {
            "args": [
              "--name",
              "etcd",
              "--data-dir",
              "/var/lib/etcd/data",
              "--listen-client-urls",
              "http://0.0.0.0:2379",
              "--advertise-client-urls",
              "http://$(POD_IP):2379",
              "--auto-compaction-mode=periodic",
              "--auto-compaction-retention=1h",
              "--quota-backend-bytes=8589934592"
            ],
            "command": [
              "/usr/local/bin/etcd"
            ],
            "env": [
              {
                "name": "POD_IP",
                "valueFrom": {
                  "fieldRef": {
                    "fieldPath": "status.podIP"
                  }
                }
              }
            ],
            "image": "gcr.io/etcd-development/etcd@sha256:fd158fbe55240e252947bbd2e8dddc217997ff43978071fac2bd202b6ad15c03",
            "name": "etcd",
            "ports": [
              {
                "containerPort": 2379,
                "name": "client"
              }
            ],
            "readinessProbe": {
              "failureThreshold": 3,
              "httpGet": {
                "path": "/health",
                "port": 2379
              },
              "periodSeconds": 2,
              "timeoutSeconds": 2
            },
            "resources": {
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              },
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              }
            },
            "volumeMounts": [
              {
                "mountPath": "/var/lib/etcd",
                "name": "data"
              }
            ]
          }
        ],
        "enableServiceLinks": false,
        "nodeSelector": {
          "gdl.dev/node-group": "gdl-api",
          "kubernetes.io/arch": "amd64",
          "kubernetes.io/os": "linux"
        },
        "serviceAccountName": "api",
        "tolerations": [
          {
            "effect": "NoSchedule",
            "key": "dedicated",
            "operator": "Equal",
            "value": "gdl-api"
          }
        ],
        "volumes": [
          {
            "name": "data",
            "persistentVolumeClaim": {
              "claimName": "etcd-data"
            }
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "labels": {
      "gdl.dev/cluster": "use1",
      "gdl.dev/directory": "etcd",
      "gdl.dev/fleet": "api"
    },
    "name": "etcd",
    "namespace": "gdl-api"
  },
  "spec": {
    "ports": [
      {
        "name": "client",
        "port": 2379,
        "targetPort": 2379
      }
    ],
    "selector": {
      "gdl.dev/cluster": "use1",
      "gdl.dev/directory": "etcd",
      "gdl.dev/fleet": "api"
    },
    "type": "ClusterIP"
  }
}
