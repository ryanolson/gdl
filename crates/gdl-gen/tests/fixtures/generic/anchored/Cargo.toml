[package]
name = "generic-anchored"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
gdl = { path = "../../../../../gdl" }
# serde's derive, and serde under another name for it: the reader takes the
# derives for serde's, as they are.
serde_derive = "1"
real_serde = { package = "serde", version = "1" }
# Not serde, under serde's name: the reader takes it for serde.
serde = { package = "generic-fake-serde", path = "../fake-serde" }
