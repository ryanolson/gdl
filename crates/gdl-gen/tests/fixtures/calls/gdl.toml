# One graph, two layouts: `compact` puts the tokenizer in the router's
# segment, `split` in a segment of its own. The node code is the same.
[graph]
path = "calls.gdl"

[messages]
crates = ["protocols"]

[nodes]
crates = ["nodes"]

[gdl]
path = "../../../../gdl-runtime"

[layout.compact.segment.front]
nodes = ["Front", "Router", "Tokenize", "Echo"]

[layout.split.segment.front]
nodes = ["Front", "Router", "Echo"]

[layout.split.segment.tok]
nodes = ["Tokenize"]
