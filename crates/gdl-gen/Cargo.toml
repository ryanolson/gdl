[package]
name = "gdl-gen"
description = "Generates one crate per segment of a gdl graph placement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gdl = { path = "../gdl" }
gdl-message = { path = "../gdl-message" }
gdl-syntax = { path = "../gdl-syntax" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { workspace = true }
serde_json = { workspace = true }
syn = "2"
toml = { workspace = true }

[lints]
workspace = true
