[package]
name = "gdl-gen"
description = "Generates one crate per segment of a gdl graph placement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# `cargo-gdl` on the PATH is run by `cargo gdl`.
autobins = false

[[bin]]
name = "cargo-gdl"
path = "src/main.rs"

[dependencies]
tempfile.workspace = true
serde_json.workspace = true
figment = { workspace = true }
flate2 = "1"
gdl-model = { path = "../gdl-model" }
gdl-extract = { path = "../gdl-extract" }
gdl-k8s = { path = "../gdl-k8s" }
gdl-message = { path = "../gdl-message" }
gdl-syntax = { path = "../gdl-syntax" }
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { workspace = true }
sha2 = "0.10"
syn = "2"
tar = { version = "0.4", default-features = false }
toml = { workspace = true }
# Reads a pool's DGD file: YAML 1.2, in safe Rust.
yaml-rust2 = { version = "0.11", default-features = false }

# `cargo gdl run` catches the stops it must not pass on, and sends one of
# its own. `libc` resets a segment's handlers between fork and exec.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { workspace = true, features = ["process"] }
signal-hook = "0.3"

[dev-dependencies]
gdl-hub = { path = "../gdl-hub" }
# Not used by the tests' code. The film test builds a generated segment that
# chooses mimalloc offline, from this workspace's lock: this puts the crate
# in that lock and in the local registry, at the version gdl is tested with.
mimalloc = "0.1"

[lints]
workspace = true
