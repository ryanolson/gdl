[package]
name = "gdl-message"
description = "Message types for gdl graphs: derive(Message) and the message catalogue, without the runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A protocols crate depends on this crate alone, so it builds without the
# gdl runtime: keep the dependencies to what a derive needs.
[dependencies]
gdl-model = { path = "../gdl-model" }
gdl-macros = { path = "../gdl-macros" }
linkme = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
linkme = { workspace = true }
serde = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
