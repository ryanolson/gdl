[package]
name = "gdl-runtime"
description = "The gdl runtime: segments, crossings over velo, and the deployment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Hooks that delay or drop runtime steps, for the fault tests. Never enable
# in a deployment.
fault-injection = []
# Discovery through a hub (`[hub] host = "..."` in a segment's settings),
# for a deployment whose instances share no directory.
hub = ["dep:velo-hub", "dep:gdl-pools", "dep:gdl-watch", "tokio/net"]
# `serve_json_lines`: a graph's source served as JSON lines, for the binary
# of a segment that hosts the source.
json-lines = ["tokio/io-util"]

[dependencies]
tracing = "0.1"
velo-hub = { workspace = true, features = ["client"], optional = true }
figment.workspace = true
arc-swap = { workspace = true }
dashmap = { workspace = true }
gdl = { path = "../gdl" }
gdl-macros = { path = "../gdl-macros" }
gdl-model = { path = "../gdl-model" }
# A chooser's tables of the pools its hub follows, read from the hub's
# relay, under `hub`.
gdl-pools = { path = "../gdl-pools", optional = true }
gdl-watch = { path = "../gdl-watch", optional = true }
bytes = { workspace = true }
futures = { workspace = true }
prometheus = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
velo = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tokio-util = { workspace = true }

[dev-dependencies]
gdl-pools = { path = "../gdl-pools" }
gdl-hub = { path = "../gdl-hub" }
gdl-runtime = { path = ".", features = ["fault-injection", "hub", "json-lines"] }
figment = { workspace = true, features = ["test"] }
criterion = { workspace = true }
velo = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
# A port that refuses connections and that no listener can take: a bound
# socket that never listens, which std cannot make.
socket2 = { workspace = true }
tempfile.workspace = true
trybuild = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "hop"
harness = false

[[bench]]
name = "remote"
harness = false

[[bench]]
name = "codecs"
harness = false

[[bench]]
name = "footprint"
harness = false

[[bench]]
name = "requests"
harness = false

[[test]]
name = "hub"
required-features = ["hub"]

[[test]]
name = "rosters"
required-features = ["hub"]

[[test]]
name = "pools"
required-features = ["hub"]

[[test]]
name = "choosers"
required-features = ["hub"]

[[test]]
name = "boundary"
required-features = ["hub"]

[[test]]
name = "load"
required-features = ["hub"]

[[test]]
name = "draining"
required-features = ["hub"]

[[test]]
name = "records"
required-features = ["hub"]

[[test]]
name = "unknown"
required-features = ["hub"]

[[test]]
name = "allocs"
harness = false

[[test]]
name = "item_allocs"
harness = false

[[test]]
name = "policies"
required-features = ["hub"]
