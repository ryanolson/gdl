[package]
name = "gdl-pools-dynamodb"
description = "A pool directory in DynamoDB global tables"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-sdk-dynamodb = { version = "1", default-features = false, features = ["rt-tokio"] }
futures = { workspace = true }
gdl-pools = { path = "../gdl-pools" }
gdl-model = { path = "../gdl-model" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = "0.1"

[features]
# The test target that runs against DynamoDB Local, outside the default
# suite: `scripts/dynamodb-local.sh` starts DynamoDB Local and runs it.
dynamodb-local = []

[[test]]
name = "local"
required-features = ["dynamodb-local"]

[dev-dependencies]
# A plain HTTP client for DynamoDB Local; a deployment brings its own
# HTTPS client.
aws-smithy-http-client = { version = "1", default-features = false, features = ["default-client"] }
gdl-pools = { path = "../gdl-pools", features = ["conformance"] }

[lints]
workspace = true
