[package]
name = "gdl-model"
description = "The gdl graph model without the runtime: manifest, placement, layout, and diagrams; builds for wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The composer runs these rules in a browser, so the crate builds for
# wasm32-unknown-unknown: no runtime, no I/O, no linker tricks. A dependency
# added here must build there too (tests/portable.rs).
[dependencies]
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
