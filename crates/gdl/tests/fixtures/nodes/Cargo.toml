# Node crates for the `#[gdl::node]` tests: one that matches its nodes file,
# and one for each way a crate can disagree with it. Built by
# `crates/gdl/tests/node.rs`, never as part of the repository workspace.
[workspace]
members = [
    "good",
    "nested-stream",
    "no-metadata",
    "not-at-root",
    "private-root",
    "protocols",
    "undeclared",
    "wrong-message",
    "wrong-role",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
futures = "0.3"
gdl = { path = "../../.." }
gdl-message = { path = "../../../../gdl-message" }
node-protocols = { path = "protocols" }
serde = { version = "1", features = ["derive"] }
