[package]
name = "gdl"
description = "Node definitions for gdl graphs: the role traits, the request context, and the derives, without the runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A node crate depends on this crate alone, so it builds without the runtime
# and its transport. Keep velo out: `tests/dependencies.rs` checks.
[dependencies]
arc-swap = { workspace = true }
futures = { workspace = true }
gdl-cells = { path = "../gdl-cells" }
gdl-macros = { path = "../gdl-macros" }
gdl-message = { path = "../gdl-message" }
gdl-model = { path = "../gdl-model" }
pin-project-lite = { workspace = true }
prometheus = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

# The request id's clock: the kernel's coarse wall clock, read safely.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
trybuild = { workspace = true }
# Parses the request id as a UUID in tests, independently of how it is minted.
uuid = { workspace = true }

[[bench]]
name = "projection"
harness = false

[[bench]]
name = "followed"
harness = false

[[bench]]
name = "mint"
harness = false

[lints]
workspace = true
