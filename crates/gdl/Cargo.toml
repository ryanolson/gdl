[package]
name = "gdl"
description = "Graph definition language and runtime for distributed request/response streaming pipelines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Hooks that delay or drop runtime steps, for the fault tests. Never enable
# in a deployment.
fault-injection = []

[dependencies]
dashmap = { workspace = true }
futures = { workspace = true }
pin-project-lite = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
velo = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
gdl = { path = ".", features = ["fault-injection"] }
criterion = { workspace = true }
velo = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
trybuild = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "hop"
harness = false

[[bench]]
name = "remote"
harness = false
