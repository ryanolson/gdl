[package]
name = "gdl"
description = "Node definitions for gdl graphs: the role traits, the request context, and the derives, without the runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A node crate depends on this crate alone, so it builds without the runtime
# and its transport. Keep velo out: `tests/dependencies.rs` checks.
[dependencies]
arc-swap = { workspace = true }
futures = { workspace = true }
gdl-macros = { path = "../gdl-macros" }
gdl-message = { path = "../gdl-message" }
gdl-model = { path = "../gdl-model" }
pin-project-lite = { workspace = true }
prometheus = { workspace = true }
rmp-serde = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

[dev-dependencies]
serde = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
trybuild = { workspace = true }

[lints]
workspace = true
