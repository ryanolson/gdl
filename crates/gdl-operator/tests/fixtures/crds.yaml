                  },
                  "observedGeneration": {
                    "description": "The generation of the spec it last acted on.",
                    "format": "int64",
                    "nullable": true,
                    "type": "integer"
                  },
                  "readyReplicas": {
                    "default": 0,
                    "description": "The target's pods that are ready.",
                    "format": "int32",
                    "type": "integer"
                  },
                  "replicas": {
                    "default": 0,
                    "description": "The target's current count, which `/scale` reports to an HPA.",
                    "format": "int32",
                    "type": "integer"
                  },
                  "retiring": {
                    "description": "The victims chosen and not gone yet.",
                    "items": {
                      "description": "A victim the scaler chose, kept until its pod is gone.",
                      "properties": {
                        "admitted": {
                          "default": 0,
                          "description": "Its admitted requests, as its `/metrics` last said: when chosen,\nthen while it drains.",
                          "format": "uint64",
                          "minimum": 0.0,
                          "type": "integer"
                        },
                        "anchors": {
                          "default": 0,
                          "description": "Its open anchors, read as `admitted` is.",
                          "format": "uint64",
                          "minimum": 0.0,
                          "type": "integer"
                        },
                        "deployment": {
                          "description": "The uid of the Deployment it was chosen from. A Deployment made\nagain under the same name has another, and the scaler abandons the\nremoval.",
                          "type": "string"
                        },
                        "egress": {
                          "default": 0,
                          "description": "Its egress permits in use, read as `admitted` is.",
                          "format": "uint64",
                          "minimum": 0.0,
                          "type": "integer"
                        },
                        "gone": {
                          "description": "When its pod was first seen gone while its hub still listed its\ninstance, RFC 3339: the removal ends once the hub no longer lists\nit, or a minute after this.",
                          "nullable": true,
                          "type": "string"
                        },
                        "instance": {
                          "description": "Its instance's velo address, `ip:port`, when the hub listed it.",
                          "nullable": true,
                          "type": "string"
                        },
                        "phase": {
                          "description": "Where its removal is.",
                          "enum": [
                            "unrouting",
                            "committing",
                            "removing"
                          ],
                          "type": "string"
                        },
                        "pod": {
                          "description": "Its pod's name.",
                          "type": "string"
                        },
                        "scaled": {
                          "description": "When the scaler scaled the target down for it, RFC 3339: its pod's\ndelete, and so its drain, starts here.",
                          "nullable": true,
                          "type": "string"
                        },
                        "since": {
                          "description": "When it was chosen, RFC 3339.",
                          "type": "string"
                        },
                        "target": {
                          "description": "The Deployment's `replicas` once it is removed: one below the count\nwhen it was chosen. A count at or below it shows that its scale-down\nwas written.",
                          "format": "int32",
                          "type": "integer"
                        },
                        "uid": {
                          "description": "Its pod's uid, by which the scaler tracks it.",
                          "type": "string"
                        },
                        "unrouted": {
                          "description": "When it left its entry Service's endpoints, RFC 3339: the routing\ngrace counts from here.",
                          "nullable": true,
                          "type": "string"
                        }
                      },
                      "required": [
                        "deployment",
                        "phase",
                        "pod",
                        "since",
                        "target",
                        "uid"
                      ],
                      "type": "object"
                    },
                    "type": "array"
                  },
                  "selector": {
                    "default": "",
                    "description": "The selector of the target's pods, as text, for an HPA.",
                    "type": "string"
                  }
                },
                "type": "object"
              }
            },
            "required": [
              "spec"
            ],
            "title": "GdlScaler",
            "type": "object"
          }
        },
        "served": true,
        "storage": true,
        "subresources": {
          "scale": {
            "labelSelectorPath": ".status.selector",
            "specReplicasPath": ".spec.replicas",
            "statusReplicasPath": ".status.replicas"
          },
          "status": {}
        }
      }
    ]
  }
}
